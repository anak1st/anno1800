[project]
name = "anno-tools"
version = "0.1.0"
description = "Anno 1800 工具链：解析游戏数据 → 卡表 JSON → 文档；维护 mod 卡池"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 解析 276 MB 的 assets.xml：C 实现 + XPath，比 stdlib ElementTree 好写也好读
    "lxml>=5.0",
    # CLI 与终端输出：命令声明式定义、表格/进度条现成
    "typer>=0.12",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anno"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]           # 中文注释行宽难控，交给 formatter

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"edit_pools.py" = ["B008"]  # Typer 的参数声明就是函数调用
"query.py" = ["B008"]
